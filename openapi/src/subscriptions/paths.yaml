paths:
  /v1/subscriptions:
    get:
      description: Get subscriptions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: schemas.yaml#/schemas/SubscriptionsResponse
          description: OK

        '400':
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
          description: Bad Request

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse

        '403':
          description: Forbidden An authenticated session with emailVerificationRequired
            cannot use this operation; return email_verification_required. Enforce
            the current account state on the server, independently of the token response
            snapshot.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
              examples:
                emailVerificationRequired:
                  value:
                    error: email_verification_required
                    message: Verify your email to perform this operation.

        '409':
          description: Conflict with current resource state, version, or account deletion
            state
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse

        '500':
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
          description: Internal Server Error

        '503':
          description: Upstream service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
      security:
        - bearerAuth: []
      summary: Get subscriptions
      tags:
        - subscription
      operationId: getSubscriptions

  /v1/subscriptions/google:
    post:
      description: Confirm Google subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: schemas.yaml#/schemas/ConfirmGoogleSubscriptionRequest
            examples:
              purchase:
                summary: Confirm a Google Play purchase
                description: Requires the Google Play integration to be enabled and
                  a real purchase token from the client; this sample cannot activate
                  a subscription.
                value:
                  subscriptionId: example-premium-product
                  purchaseToken: example-google-play-purchase-token
        description: Purchase IdToken
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/MessageResponse
          description: OK

        '400':
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
          description: Bad Request

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse

        '403':
          description: Forbidden An authenticated session with emailVerificationRequired
            cannot use this operation; return email_verification_required. Enforce
            the current account state on the server, independently of the token response
            snapshot.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
              examples:
                emailVerificationRequired:
                  value:
                    error: email_verification_required
                    message: Verify your email to perform this operation.

        '409':
          description: Conflict with current resource state, version, or account deletion
            state
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse

        '500':
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
          description: Internal Server Error

        '503':
          description: Upstream service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
      security:
        - bearerAuth: []
      summary: Confirm Google subscription
      tags:
        - subscription
      x-codegen-request-body-name: input
      operationId: confirmGoogleSubscription
