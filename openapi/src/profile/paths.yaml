paths:
  /v1/profile:
    get:
      description: Get profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: schemas.yaml#/schemas/ProfileResponse

        '400':
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
          description: Bad Request

        '401':
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
          description: Unauthorized

        '403':
          description: Forbidden An authenticated session with emailVerificationRequired
            cannot use this operation; return email_verification_required. Enforce
            the current account state on the server, independently of the token response
            snapshot.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
              examples:
                emailVerificationRequired:
                  value:
                    error: email_verification_required
                    message: Verify your email to perform this operation.

        '404':
          description: Referenced resource not found
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse

        '409':
          description: Conflict with current resource state, version, or account deletion
            state
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse

        '500':
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
          description: Internal Server Error

        '503':
          description: Upstream service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/schemas/ErrorResponse
      security:
        - bearerAuth: []
      summary: Get profile
      tags:
        - profile
      operationId: getProfile

