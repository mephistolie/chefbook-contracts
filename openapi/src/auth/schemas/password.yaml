schemas:
  SetPasswordRequest:
    type: object
    properties:
      newPassword:
        type: string
        minLength: 1
        writeOnly: true
    required:
      - newPassword
    additionalProperties: false

  RequestPasswordResetRequest:
    type: object
    properties:
      email:
        type: string
        format: email
    required:
      - email
    additionalProperties: false

  ConfirmPasswordResetRequest:
    type: object
    properties:
      token:
        type: string
        minLength: 1
        writeOnly: true
      newPassword:
        type: string
        minLength: 1
        writeOnly: true
    required:
      - token
      - newPassword
    additionalProperties: false
