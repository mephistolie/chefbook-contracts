paths:
  /v1/account/password:
    put:
      operationId: setPassword
      summary: Set password
      tags:
        - auth
      security:
        - bearerAuth: []
        - bearerAuth: []
          reauthenticationAuth: []
      description: Existing password requires passwordChange grant; first password
        may be set with full bearer alone only while stored hash is NULL. Concurrency
        must preserve this condition. Credential changes revoke existing trust and
        do not disable MFA. Repeating identical desired state must not reset timestamps
        or repeat side effects.
      parameters:
        - name: Reauthentication-Token
          in: header
          required: false
          schema:
            type: string
            minLength: 1
          description: Completed authentication grant for this action. Password first-set
            exception is documented separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/password.yaml#/schemas/SetPasswordRequest
            examples:
              firstPassword:
                summary: Set a first password
                description: For an account without a password, the current Bearer
                  is sufficient; no Reauthentication-Token is required.
                value:
                  newPassword: Example-only-Password-42!
              replacePassword:
                summary: Replace an existing password
                description: Send the current Bearer and a passwordChange Reauthentication-Token.
                  The request body does not contain the old password.
                value:
                  newPassword: Another-example-Password-73!
      responses:
        '204':
          description: No Content
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache

        '400':
          $ref: ../../chefbook.yaml#/components/responses/BadRequest

        '401':
          $ref: ../../chefbook.yaml#/components/responses/Unauthorized

        '403':
          $ref: ../../chefbook.yaml#/components/responses/Forbidden

        '409':
          $ref: ../../chefbook.yaml#/components/responses/Conflict

        '429':
          $ref: ../../chefbook.yaml#/components/responses/TooManyRequests

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable

  /v1/account/password/reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset
      tags:
        - auth
      security: []
      description: Neutral response for unknown and known emails. Queue mail, do not
        disclose account existence. No session created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/password.yaml#/schemas/RequestPasswordResetRequest
            examples:
              knownEmail:
                summary: Request a reset email
                description: Public endpoint. The accepted response does not disclose
                  whether an account exists.
                value:
                  email: alex.smith@example.com
              unknownEmail:
                summary: Unknown or non-eligible email
                description: Same public response as for an eligible account; this
                  is not an account-discovery endpoint.
                value:
                  email: nobody@example.com
      responses:
        '202':
          description: Request password reset
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache

        '400':
          $ref: ../../chefbook.yaml#/components/responses/BadRequest

        '429':
          $ref: ../../chefbook.yaml#/components/responses/TooManyRequests

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable

  /v1/account/password/reset/confirmation:
    post:
      operationId: confirmPasswordReset
      summary: Confirm a password reset
      tags:
        - auth
      security: []
      description: Consume single-use token and set password; revoke affected sessions
        and trust. Does not disable TOTP or create an MFA-bypassing session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/password.yaml#/schemas/ConfirmPasswordResetRequest
            examples:
              fromEmail:
                summary: Confirm password reset
                description: Use the unexpired token from the reset message. This
                  flow does not require an existing access session.
                value:
                  token: example-password-reset-token
                  newPassword: Example-only-Password-42!
      responses:
        '204':
          description: No Content
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache

        '400':
          $ref: ../../chefbook.yaml#/components/responses/BadRequest

        '429':
          $ref: ../../chefbook.yaml#/components/responses/TooManyRequests

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable
