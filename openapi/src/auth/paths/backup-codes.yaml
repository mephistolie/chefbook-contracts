paths:
  /v1/account/backup-codes:
    get:
      operationId: getBackupCodesStatus
      summary: Get backup codes status
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Read backup-code status
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache
          content:
            application/json:
              schema:
                $ref: ../schemas/backup-codes.yaml#/schemas/BackupCodesStatusResponse

        '401':
          $ref: ../../chefbook.yaml#/components/responses/Unauthorized

        '403':
          $ref: ../../chefbook.yaml#/components/responses/Forbidden

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable
      description: Return the remaining code count and generation timestamp. Plaintext
        backup codes are never returned by this operation.

    post:
      operationId: generateBackupCodes
      summary: Generate backup codes
      tags:
        - auth
      security:
        - bearerAuth: []
          reauthenticationAuth: []
      description: Generate a new set and invalidate all previous backup codes. Requires
        a backupCodesRotation grant. Plaintext codes are returned only in this response.
      parameters:
        - name: Reauthentication-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Single-use confirmation token for this action, bound to the
            current account and access session.
      responses:
        '201':
          description: Replace backup codes
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache
            Location:
              required: true
              description: /v1/account/backup-codes
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/backup-codes.yaml#/schemas/BackupCodesResponse

        '401':
          $ref: ../../chefbook.yaml#/components/responses/Unauthorized

        '403':
          $ref: ../../chefbook.yaml#/components/responses/Forbidden

        '409':
          $ref: ../../chefbook.yaml#/components/responses/Conflict

        '429':
          $ref: ../../chefbook.yaml#/components/responses/TooManyRequests

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable
