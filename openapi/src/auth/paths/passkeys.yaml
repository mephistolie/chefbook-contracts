paths:
  /v1/account/passkeys:
    get:
      operationId: getPasskeys
      summary: Get registered passkeys
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List passkeys
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache
          content:
            application/json:
              schema:
                $ref: ../schemas/passkeys.yaml#/schemas/PasskeysResponse

        '401':
          $ref: ../../chefbook.yaml#/components/responses/Unauthorized

        '403':
          $ref: ../../chefbook.yaml#/components/responses/Forbidden

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable

    post:
      operationId: confirmPasskeyRegistration
      summary: Confirm passkey registration
      tags:
        - auth
      security:
        - bearerAuth: []
      description: Verify the authenticator response against the pending registration
        request from this session and store the new passkey. The private key stays
        with the authenticator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/passkeys.yaml#/schemas/ConfirmPasskeyRegistrationRequest
            examples:
              platformPasskey:
                summary: Register a platform passkey
                description: Use requestId from requestPasskeyRegistration and the
                  actual credential returned by the OS. Encoded bytes here illustrate
                  the shape; they are not a valid attestation.
                value:
                  requestId: 11111111-1111-4111-8111-111111111111
                  name: Personal phone
                  credential:
                    id: ZXhhbXBsZS1uZXctY3JlZGVudGlhbC1pZA
                    rawId: ZXhhbXBsZS1uZXctY3JlZGVudGlhbC1pZA
                    type: public-key
                    response:
                      clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIiwiY2hhbGxlbmdlIjoiZXhhbXBsZS1jaGFsbGVuZ2UiLCJvcmlnaW4iOiJodHRwczovL2FwcC5leGFtcGxlLmNvbSJ9
                      attestationObject: ZXhhbXBsZS1hdHRlc3RhdGlvbi1vYmplY3Q
                      transports:
                        - internal
                    authenticatorAttachment: platform
                    clientExtensionResults: {}
              hardwareKey:
                summary: Register an external security key
                description: Use the actual hardware-key attestation associated with
                  this pending registration and Bearer session.
                value:
                  requestId: 22222222-2222-4222-8222-222222222222
                  name: USB security key
                  credential:
                    id: ZXhhbXBsZS1uZXctY3JlZGVudGlhbC1pZA
                    rawId: ZXhhbXBsZS1uZXctY3JlZGVudGlhbC1pZA
                    type: public-key
                    response:
                      clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIiwiY2hhbGxlbmdlIjoiZXhhbXBsZS1jaGFsbGVuZ2UiLCJvcmlnaW4iOiJodHRwczovL2FwcC5leGFtcGxlLmNvbSJ9
                      attestationObject: ZXhhbXBsZS1hdHRlc3RhdGlvbi1vYmplY3Q
                      transports:
                        - usb
                        - nfc
                    authenticatorAttachment: cross-platform
                    clientExtensionResults: {}
      responses:
        '201':
          description: Register passkey
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache
            Location:
              required: true
              description: /v1/account/passkeys/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/passkeys.yaml#/schemas/Passkey

        '400':
          $ref: ../../chefbook.yaml#/components/responses/BadRequest

        '401':
          $ref: ../../chefbook.yaml#/components/responses/Unauthorized

        '403':
          $ref: ../../chefbook.yaml#/components/responses/Forbidden

        '404':
          $ref: ../../chefbook.yaml#/components/responses/NotFound

        '409':
          $ref: ../../chefbook.yaml#/components/responses/Conflict

        '429':
          $ref: ../../chefbook.yaml#/components/responses/TooManyRequests

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable

  /v1/account/passkeys/requests:
    post:
      operationId: requestPasskeyRegistration
      summary: Request passkey registration
      tags:
        - auth
      security:
        - bearerAuth: []
          reauthenticationAuth: []
      description: Prepare WebAuthn creation options and a registration request bound
        to the current account and session. Requires a passkeyEnrollment grant; no
        passkey is stored at this step.
      parameters:
        - name: Reauthentication-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Single-use confirmation token for this action, bound to the
            current account and access session.
      responses:
        '201':
          description: Prepare passkey registration
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache
            Location:
              required: true
              description: /v1/account/passkeys/requests/{requestId}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/passkeys.yaml#/schemas/RequestPasskeyRegistrationResponse

        '401':
          $ref: ../../chefbook.yaml#/components/responses/Unauthorized

        '403':
          $ref: ../../chefbook.yaml#/components/responses/Forbidden

        '409':
          $ref: ../../chefbook.yaml#/components/responses/Conflict

        '429':
          $ref: ../../chefbook.yaml#/components/responses/TooManyRequests

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable

  /v1/account/passkeys/{id}:
    patch:
      operationId: renamePasskey
      summary: Rename a passkey
      tags:
        - auth
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/passkeys.yaml#/schemas/RenamePasskeyRequest
            examples:
              rename:
                summary: Rename a passkey
                value:
                  name: Work laptop
      responses:
        '200':
          description: Rename passkey
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache
          content:
            application/json:
              schema:
                $ref: ../schemas/passkeys.yaml#/schemas/Passkey

        '400':
          $ref: ../../chefbook.yaml#/components/responses/BadRequest

        '401':
          $ref: ../../chefbook.yaml#/components/responses/Unauthorized

        '403':
          $ref: ../../chefbook.yaml#/components/responses/Forbidden

        '404':
          $ref: ../../chefbook.yaml#/components/responses/NotFound

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable

    delete:
      operationId: deletePasskey
      summary: Delete a passkey
      tags:
        - auth
      security:
        - bearerAuth: []
          reauthenticationAuth: []
      description: Requires passkeyRemoval grant. Check ownership independently of
        grant. Do not remove final usable primary sign-in method.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Reauthentication-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Single-use confirmation token for this action, bound to the
            current account and access session.
      responses:
        '204':
          description: No Content
          headers:
            Cache-Control:
              $ref: ../../chefbook.yaml#/components/headers/CacheControlNoStore
            Pragma:
              $ref: ../../chefbook.yaml#/components/headers/PragmaNoCache

        '401':
          $ref: ../../chefbook.yaml#/components/responses/Unauthorized

        '403':
          $ref: ../../chefbook.yaml#/components/responses/Forbidden

        '409':
          $ref: ../../chefbook.yaml#/components/responses/Conflict

        '503':
          $ref: ../../chefbook.yaml#/components/responses/ServiceUnavailable
