schemas:
  RecipeAddCollectionRequest:
    type: object
    properties:
      collectionId:
        type: string
        nullable: true
      name:
        type: string
      visibility:
        type: string
    required:
    - name
  RecipeAddCollectionResponse:
    type: object
    properties:
      collectionId:
        type: string
    required:
    - collectionId
  RecipeCollectionInfoResponse:
    type: object
    properties:
      name:
        type: string
    required:
    - name
  RecipeCollectionResponse:
    type: object
    properties:
      collectionId:
        type: string
      name:
        type: string
      visibility:
        type: string
      contributors:
        type: array
        items:
          $ref: ../chefbook.yaml#/components/schemas/RecipeContributorResponse
      recipesCount:
        type: integer
        format: int32
    required:
    - collectionId
    - name
    - visibility
    - contributors
    - recipesCount
  RecipeGetCollectionResponse:
    type: object
    properties:
      collection:
        $ref: ../chefbook.yaml#/components/schemas/RecipeCollectionResponse
      profilesInfo:
        type: object
        additionalProperties:
          $ref: ../chefbook.yaml#/components/schemas/ProfileMinInfo
    required:
    - collection
    - profilesInfo
  RecipeGetCollectionsResponse:
    type: object
    properties:
      collections:
        type: array
        items:
          $ref: ../chefbook.yaml#/components/schemas/RecipeCollectionResponse
      profilesInfo:
        type: object
        additionalProperties:
          $ref: ../chefbook.yaml#/components/schemas/ProfileMinInfo
    required:
    - collections
    - profilesInfo
  RecipeSaveCollectionToRecipeBookRequest:
    type: object
    properties:
      contributorKey:
        type: string
        nullable: true
  RecipeUpdateCollectionRequest:
    type: object
    properties:
      name:
        type: string
      visibility:
        type: string
    required:
    - name
