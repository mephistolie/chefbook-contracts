schemas:
  ShoppingListCreateSharedShoppingListRequest:
    type: object
    properties:
      shoppingListId:
        type: string
        nullable: true
      name:
        type: string
        nullable: true
  ShoppingListCreateShoppingListResponse:
    type: object
    properties:
      shoppingListId:
        type: string
    required:
    - shoppingListId
  ShoppingListGetShoppingListBodyResponse:
    type: object
    properties:
      shoppingListId:
        type: string
      name:
        type: string
        nullable: true
      type:
        type: string
      owner:
        $ref: ../chefbook.yaml#/components/schemas/ProfileInfo
      purchases:
        type: array
        items:
          $ref: ../chefbook.yaml#/components/schemas/ShoppingListPurchase
      recipeNames:
        type: object
        additionalProperties:
          type: string
        nullable: true
      version:
        type: integer
        format: int32
    required:
    - shoppingListId
    - type
    - owner
    - purchases
    - recipeNames
    - version
  ShoppingListGetShoppingListLinkResponse:
    type: object
    properties:
      link:
        type: string
      expirationTimestamp:
        type: string
        format: date-time
    required:
    - link
    - expirationTimestamp
  ShoppingListJoinShoppingListRequest:
    type: object
    properties:
      key:
        type: string
  ShoppingListPurchase:
    type: object
    properties:
      purchaseId:
        type: string
      name:
        type: string
      multiplier:
        type: integer
        format: int32
        nullable: true
      purchased:
        type: boolean
      amount:
        type: number
        format: float
        nullable: true
      measureUnit:
        type: string
        nullable: true
      recipeId:
        type: string
        nullable: true
    required:
    - purchaseId
    - name
  ShoppingListSetShoppingListNameRequest:
    type: object
    properties:
      name:
        type: string
        nullable: true
  ShoppingListSetShoppingListRequest:
    type: object
    properties:
      purchases:
        type: array
        items:
          $ref: ../chefbook.yaml#/components/schemas/ShoppingListPurchase
        nullable: true
      lastVersion:
        type: integer
        format: int32
        nullable: true
  ShoppingListSetShoppingListResponse:
    type: object
    properties:
      version:
        type: integer
        format: int32
    required:
    - version
  ShoppingListShoppingListInfoResponse:
    type: object
    properties:
      shoppingListId:
        type: string
      name:
        type: string
        nullable: true
      type:
        type: string
      owner:
        $ref: ../chefbook.yaml#/components/schemas/ProfileInfo
      version:
        type: integer
        format: int32
    required:
    - shoppingListId
    - type
    - owner
    - version
