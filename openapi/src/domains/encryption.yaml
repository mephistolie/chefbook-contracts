    properties:
      publicKey:
        type: string
      privateKey:
        type: string
      salt:
        type: string
  EncryptionDeleteEncryptedVaultRequest:
    type: object
    properties:
      deleteCode:
        type: string
  EncryptionGetEncryptedVaultKeyResponse:
    type: object
    properties:
