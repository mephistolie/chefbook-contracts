paths:
  /v1/recipes/tags:
    get:
      description: Get recipe tags
      parameters:
      - description: Language code
        in: query
        name: language
        schema:
          type: string
      - description: Tag groups
        explode: true
        in: query
        name: group
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/TagTagsAndGroupsResponse
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Internal Server Error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '409':
          description: Conflict with current resource state, version, or account deletion
            state
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '503':
          description: Upstream service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
      security:
      - bearerAuth: []
      summary: Get tags
      tags:
      - tag
      operationId: getTags
  /v1/recipes/tags/groups:
    get:
      description: Get recipe tag groups
      parameters:
      - description: Language code
        in: query
        name: language
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Internal Server Error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '409':
          description: Conflict with current resource state, version, or account deletion
            state
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '503':
          description: Upstream service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
      security:
      - bearerAuth: []
      summary: Get tag groups
      tags:
      - tag
      operationId: getTagGroups
  /v1/recipes/tags/{tag_id}:
    get:
      description: Get recipe tag
      parameters:
      - description: Tag ID
        in: path
        name: tag_id
        required: true
        schema:
          type: string
      - description: Language code
        in: query
        name: language
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/TagTagWithGroupNameResponse
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Internal Server Error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '404':
          description: Referenced resource not found
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '409':
          description: Conflict with current resource state, version, or account deletion
            state
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '503':
          description: Upstream service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
      security:
      - bearerAuth: []
      summary: Get tag
      tags:
      - tag
      operationId: getTag
schemas:
  TagTagResponse:
    type: object
    properties:
      tagId:
        type: string
      name:
        type: string
      emoji:
        type: string
        nullable: true
      groupId:
        type: string
        nullable: true
    required:
    - tagId
    - name
  TagTagWithGroupNameResponse:
    type: object
    properties:
      tagId:
        type: string
      name:
        type: string
      emoji:
        type: string
        nullable: true
      groupId:
        type: string
        nullable: true
      groupName:
        type: string
        nullable: true
    required:
    - tagId
    - name
  TagTagsAndGroupsResponse:
    type: object
    properties:
      tags:
        type: array
        items:
          $ref: ../chefbook.yaml#/components/schemas/TagTagResponse
        nullable: true
      groups:
        type: object
        additionalProperties:
          type: string
        nullable: true
    required:
    - tags
