paths:
  /v1/subscriptions:
    get:
      description: Get subscriptions
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: ../chefbook.yaml#/components/schemas/SubscriptionSubscriptionResponse
                type: array
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Internal Server Error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '409':
          description: Conflict with current resource state, version, or account deletion
            state
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '503':
          description: Upstream service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
      security:
      - bearerAuth: []
      summary: Get subscriptions
      tags:
      - subscription
      operationId: getSubscriptions
  /v1/subscriptions/google:
    post:
      description: Confirm Google subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../chefbook.yaml#/components/schemas/SubscriptionConfirmGoogleSubscriptionRequest
        description: Purchase IdToken
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/MessageResponse
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
          description: Internal Server Error
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '409':
          description: Conflict with current resource state, version, or account deletion
            state
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
        '503':
          description: Upstream service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: ../chefbook.yaml#/components/schemas/ErrorResponse
      security:
      - bearerAuth: []
      summary: Confirm Google subscription
      tags:
      - subscription
      x-codegen-request-body-name: input
      operationId: confirmGoogleSubscription
schemas:
  SubscriptionConfirmGoogleSubscriptionRequest:
    type: object
    properties:
      subscriptionId:
        type: string
      purchaseToken:
        type: string
  SubscriptionSubscriptionResponse:
    type: object
    properties:
      plan:
        type: string
      source:
        type: string
        nullable: true
      expirationTimestamp:
        type: string
        format: date-time
        nullable: true
      autoRenew:
        type: boolean
    required:
    - plan
