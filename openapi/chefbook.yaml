    post:
      operationId: confirmEmailChange
      summary: Confirm an email change step
      tags:
        - auth
      security: []
      description: |-
        Confirm the step identified by the one-use email token. Confirming the previous address sends a message to the new address and returns pendingNewEmail; it does not change the account email yet. Confirming the new address applies the change and returns changed.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Confirm the old email

        Use the token from the old address; the result is pendingNewEmail and the next email is sent to the new address.

        Content-Type: `application/json`

        ```json
        {
          "token": "example-oldEmail-change-token"
        }
        ```

        #### Confirm the new email

        Use the token from the new address; the result is changed. The old-address token cannot complete this step.

        Content-Type: `application/json`

        ```json
        {
          "token": "example-newEmail-change-token"
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChangeRequest'
            examples:
              oldEmail:
                summary: Confirm the old email
                description: Use the token from the old address; the result is pendingNewEmail
                  and the next email is sent to the new address.
                value:
                  token: example-oldEmail-change-token
              newEmail:
                summary: Confirm the new email
                description: Use the token from the new address; the result is changed.
                  The old-address token cannot complete this step.
                value:
                  token: example-newEmail-change-token
      responses:
