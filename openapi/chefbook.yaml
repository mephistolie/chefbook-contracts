openapi: 3.0.3
info:
  contact:
    email: support@chefbook.io
    name: ChefBook API Support
  description: ChefBook API Server
  title: ChefBook API
  version: 0.2.0
servers:
- url: /
  description: Current gateway origin; clients configure their own base URL
paths:
  /v1/auth/activate:
    get:
      description: Activate profile
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        schema:
          type: string
      - description: Activation code
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Activate ProfileInfo
      tags:
      - auth
      operationId: activateProfile
      security: []
  /v1/auth/google:
    delete:
      description: Delete Google connection for profile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      summary: Delete Google Connection
      tags:
      - auth
      operationId: deleteGoogleConnection
    post:
      description: Sign in to profile via Google Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthGoogleOAuthRequest'
        description: Code
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Sign In Google
      tags:
      - auth
      x-codegen-request-body-name: input
      operationId: signInGoogle
      security: []
    put:
      description: Connect Google to existing profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthOAuthCodeRequest'
        description: Credentials
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
