              "userHandle": "ZXhhbXBsZS1hY2NvdW50LWhhbmRsZQ"
            }
          }
        }
        ```

        #### Passkey on a security key

        Illustrates nullable userHandle and an external authenticator. Use real WebAuthn bytes; these sample signatures cannot authenticate.

        Content-Type: `application/json`

        ```json
        {
          "type": "passkeyVerification",
          "credential": {
            "id": "ZXhhbXBsZS1jcmVkZW50aWFsLWlk",
            "rawId": "ZXhhbXBsZS1jcmVkZW50aWFsLWlk",
            "type": "public-key",
            "response": {
              "clientDataJSON": "eyJ0eXBlIjoid2ViYXV0aG4uZ2V0IiwiY2hhbGxlbmdlIjoiZXhhbXBsZS1jaGFsbGVuZ2UiLCJvcmlnaW4iOiJodHRwczovL2FwcC5leGFtcGxlLmNvbSJ9",
              "authenticatorData": "ZXhhbXBsZS1hdXRoZW50aWNhdG9yLWRhdGE",
              "signature": "ZXhhbXBsZS1zaWduYXR1cmU",
              "userHandle": null
            },
            "authenticatorAttachment": "cross-platform",
            "clientExtensionResults": {}
          }
        }
        ```

        #### Supply only the registration email

        A dot before @ is valid. No username, password or provider. Existing and unused addresses both proceed to emailVerification.

        Content-Type: `application/json`

        ```json
        {
          "type": "registration",
          "email": "alex.smith@example.com"
        }
        ```

        #### Set a password after verifying the email

        Synthetic password. Only for a new account with email verified in this process; never a password reset.

        Content-Type: `application/json`

        ```json
        {
          "type": "passwordSetup",
          "password": "Example-only-Password-42!"
        }
