        '403':
          $ref: '#/components/responses/Forbidden'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    post:
      operationId: createSession
      summary: Create a session
      tags:
        - auth
      security: []
      description: |-
        Atomically consume signIn/signUp grant and create a full session. Reauthentication grants cannot create sessions. No incomplete registration sessions.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Exchange completed sign-in for a session

        Use confirmationToken from the mutation that completed a signIn flow. This is a one-use grant, not an access token.

        Content-Type: `application/json`

        ```json
        {
          "authenticationToken": "example-sign-in-confirmation-token"
        }
        ```

        #### Exchange completed registration for a session

        All registration steps must succeed first. Use the signUp confirmationToken; sensitive-action reauthentication grants cannot create a session.

        Content-Type: `application/json`

        ```json
        {
          "authenticationToken": "example-sign-up-confirmation-token"
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            examples:
              completedSignIn:
                summary: Exchange completed sign-in for a session
                description: Use confirmationToken from the mutation that completed
                  a signIn flow. This is a one-use grant, not an access token.
                value:
                  authenticationToken: example-sign-in-confirmation-token
              completedSignUp:
                summary: Exchange completed registration for a session
                description: All registration steps must succeed first. Use the signUp
                  confirmationToken; sensitive-action reauthentication grants cannot
                  create a session.
                value:
                  authenticationToken: example-sign-up-confirmation-token
      responses:
        '201':
          description: Create session from completed authentication
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Location:
              required: true
              description: /v1/sessions/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '403':
          $ref: '#/components/responses/Forbidden'

        '409':
          $ref: '#/components/responses/Conflict'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      operationId: revokeAllSessions
      summary: Revoke all sessions
      tags:
        - auth
      security:
        - bearerAuth: []
      description: Revoke all including current. No IDs filter and no DELETE body.
      responses:
        '204':
          description: No Content
          headers:
            Cache-Control:
