components:
  schemas:
    RequestAccountDeletionRequest:
      type: object
      properties:
        deleteSharedData:
          type: boolean
          default: false
          description: Whether to delete all recipes and collections owned by this
            account, including those used by other users. If false or omitted, preserve
            non-private recipes bookmarked by other users and owned collections used
            by others; delete the remaining owned recipes and collections. Bookmarks
            reference originals, not independent copies. Deleting an original removes
            its bookmarks. Other users' recipes are not deleted. Preserved recipes
            display a deleted-profile author. Collection ownership after account deletion
            requires a separate policy before implementation.
      additionalProperties: false

    AccountDeletionResponse:
      type: object
      properties:
        deletionTimestamp:
          type: string
          format: date-time
        deleteSharedData:
          type: boolean
          description: The content deletion policy stored in this account deletion
            request.
      required:
        - deletionTimestamp
        - deleteSharedData

    UpdateAccountDeletionRequest:
      type: object
      properties:
        deleteSharedData:
          type: boolean
          description: Replace the stored content deletion policy without changing
            the deletion deadline.
      required:
        - deleteSharedData
      additionalProperties: false

    CompleteAuthenticationStepRequest:
      oneOf:
        - $ref: '#/components/schemas/RegistrationStepCompletion'
        - $ref: '#/components/schemas/PasswordSetupStepCompletion'
        - $ref: '#/components/schemas/PasswordVerificationStepCompletion'
        - $ref: '#/components/schemas/EmailVerificationStepCompletion'
        - $ref: '#/components/schemas/TotpVerificationStepCompletion'
        - $ref: '#/components/schemas/BackupCodeVerificationStepCompletion'
        - $ref: '#/components/schemas/GoogleVerificationStepCompletion'
        - $ref: '#/components/schemas/VkVerificationStepCompletion'
        - $ref: '#/components/schemas/PasskeyVerificationStepCompletion'
      discriminator:
        propertyName: type
        mapping:
          registration: '#/components/schemas/RegistrationStepCompletion'
          passwordSetup: '#/components/schemas/PasswordSetupStepCompletion'
          passwordVerification: '#/components/schemas/PasswordVerificationStepCompletion'
          emailVerification: '#/components/schemas/EmailVerificationStepCompletion'
          totpVerification: '#/components/schemas/TotpVerificationStepCompletion'
          backupCodeVerification: '#/components/schemas/BackupCodeVerificationStepCompletion'
          googleVerification: '#/components/schemas/GoogleVerificationStepCompletion'
          vkVerification: '#/components/schemas/VkVerificationStepCompletion'
          passkeyVerification: '#/components/schemas/PasskeyVerificationStepCompletion'
      description: Flat typed input. type must match the referenced pending step;
        no data/registration/authentication wrapper. Credentials and proofs are write-only.
        The server also enforces purpose, prerequisites and the selected OAuth mode.

    PasswordVerificationStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - passwordVerification
        password:
          type: string
          minLength: 1
          writeOnly: true
        login:
          type: string
          minLength: 1
      required:
        - type
        - password
      additionalProperties: false
      description: 'signIn requires login (email or username). Reauthentication forbids
        login: account comes from the originating session. Login is not persisted
        as authentication context.'

    EmailVerificationStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - emailVerification
        code:
          type: string
          minLength: 6
          writeOnly: true
          pattern: ^[0-9]{6}$
          maxLength: 6
      required:
        - type
        - code
      additionalProperties: false

    TotpVerificationStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - totpVerification
        code:
          type: string
          minLength: 6
          writeOnly: true
          pattern: ^[0-9]{6}$
          maxLength: 6
      required:
        - type
        - code
      additionalProperties: false

    BackupCodeVerificationStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - backupCodeVerification
        code:
          type: string
          minLength: 1
          writeOnly: true
      required:
        - type
        - code
      additionalProperties: false

    GoogleVerificationStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - googleVerification
        idToken:
          type: string
          minLength: 1
          writeOnly: true
        code:
          type: string
          minLength: 1
          writeOnly: true
        state:
          type: string
          minLength: 1
          writeOnly: true
      required:
        - type
      additionalProperties: false
      oneOf:
        - required:
            - idToken
          not:
            anyOf:
              - required:
                  - code
              - required:
                  - state
        - required:
            - code
            - state
          not:
            required:
              - idToken

    VkVerificationStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - vkVerification
        code:
          type: string
          minLength: 1
          writeOnly: true
        state:
          type: string
          minLength: 1
          writeOnly: true
      required:
        - type
        - code
        - state
      additionalProperties: false

    PasskeyVerificationStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - passkeyVerification
        credential:
          $ref: '#/components/schemas/PasskeyAssertion'
      required:
        - type
        - credential
      additionalProperties: false

    RegistrationStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - registration
        email:
          type: string
          format: email
      required:
        - type
        - email
      additionalProperties: false
      description: Email only. Username is selected after account creation through
        authorized account endpoints. Returns the same emailVerification next option
        for an existing or unused email; never accepts a password or provider choice.

    PasswordSetupStepCompletion:
      type: object
      properties:
        type:
          type: string
          enum:
            - passwordSetup
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
        - type
        - password
      additionalProperties: false
      description: Hash only after verifying the process, prerequisites and email
        ownership. No password setup before email verification. Final account creation
        rechecks email uniqueness atomically; never overwrites an existing account.

    CompleteAuthenticationStepResponse:
      type: object
      properties:
        step:
          $ref: '#/components/schemas/AuthenticationStep'
        authentication:
          $ref: '#/components/schemas/AuthenticationResponse'
      required:
        - step
        - authentication
      additionalProperties: false
      description: Updated step and process. 200 means this step completed successfully;
        next.options may require more work. A final successful mutation alone returns
        the one-use confirmationToken. Invalid input returns a 4xx without completing
        the step; it counts toward applicable limits. Completed steps cannot be replayed
        to mint credentials or grants.

    StartAuthenticationStepRequest:
      oneOf:
        - $ref: '#/components/schemas/StartRegistrationStepRequest'
        - $ref: '#/components/schemas/StartPasswordSetupStepRequest'
        - $ref: '#/components/schemas/StartPasswordVerificationStepRequest'
        - $ref: '#/components/schemas/StartEmailVerificationStepRequest'
        - $ref: '#/components/schemas/StartTotpVerificationStepRequest'
        - $ref: '#/components/schemas/StartBackupCodeVerificationStepRequest'
        - $ref: '#/components/schemas/StartGoogleVerificationStepRequest'
        - $ref: '#/components/schemas/StartVkVerificationStepRequest'
        - $ref: '#/components/schemas/StartPasskeyVerificationStepRequest'
      discriminator:
        propertyName: type
        mapping:
          registration: '#/components/schemas/StartRegistrationStepRequest'
          passwordSetup: '#/components/schemas/StartPasswordSetupStepRequest'
          passwordVerification: '#/components/schemas/StartPasswordVerificationStepRequest'
          emailVerification: '#/components/schemas/StartEmailVerificationStepRequest'
          totpVerification: '#/components/schemas/StartTotpVerificationStepRequest'
          backupCodeVerification: '#/components/schemas/StartBackupCodeVerificationStepRequest'
          googleVerification: '#/components/schemas/StartGoogleVerificationStepRequest'
          vkVerification: '#/components/schemas/StartVkVerificationStepRequest'
          passkeyVerification: '#/components/schemas/StartPasskeyVerificationStepRequest'
      description: Start one advertised step. No registration data, password or proof
        is accepted here. Starting an email step queues its code; starting OAuth/WebAuthn
        prepares its ceremony. Starting passwordSetup requires email verification
        in the same signUp process and no existing account.

    AuthenticationStepOption:
      oneOf:
        - $ref: '#/components/schemas/StartRegistrationStepRequest'
        - $ref: '#/components/schemas/StartPasswordSetupStepRequest'
        - $ref: '#/components/schemas/StartPasswordVerificationStepRequest'
        - $ref: '#/components/schemas/StartEmailVerificationStepRequest'
        - $ref: '#/components/schemas/StartTotpVerificationStepRequest'
        - $ref: '#/components/schemas/StartBackupCodeVerificationStepRequest'
        - $ref: '#/components/schemas/GoogleVerificationStepOption'
        - $ref: '#/components/schemas/VkVerificationStepOption'
        - $ref: '#/components/schemas/StartPasskeyVerificationStepRequest'
      discriminator:
        propertyName: type
        mapping:
          registration: '#/components/schemas/StartRegistrationStepRequest'
          passwordSetup: '#/components/schemas/StartPasswordSetupStepRequest'
          passwordVerification: '#/components/schemas/StartPasswordVerificationStepRequest'
          emailVerification: '#/components/schemas/StartEmailVerificationStepRequest'
          totpVerification: '#/components/schemas/StartTotpVerificationStepRequest'
          backupCodeVerification: '#/components/schemas/StartBackupCodeVerificationStepRequest'
          googleVerification: '#/components/schemas/GoogleVerificationStepOption'
          vkVerification: '#/components/schemas/VkVerificationStepOption'
          passkeyVerification: '#/components/schemas/StartPasskeyVerificationStepRequest'
      description: A permitted next action. These are alternatives, not a list of
        independent mandatory factors. Provider options describe a type; the client
        supplies allowed redirect/credential settings when starting it.

    AuthenticationStep:
      oneOf:
        - $ref: '#/components/schemas/RegistrationStep'
        - $ref: '#/components/schemas/PasswordSetupStep'
        - $ref: '#/components/schemas/PasswordVerificationStep'
        - $ref: '#/components/schemas/EmailVerificationStep'
        - $ref: '#/components/schemas/TotpVerificationStep'
        - $ref: '#/components/schemas/BackupCodeVerificationStep'
        - $ref: '#/components/schemas/GoogleVerificationStep'
        - $ref: '#/components/schemas/VkVerificationStep'
        - $ref: '#/components/schemas/PasskeyVerificationStep'
      discriminator:
        propertyName: type
        mapping:
          registration: '#/components/schemas/RegistrationStep'
          passwordSetup: '#/components/schemas/PasswordSetupStep'
          passwordVerification: '#/components/schemas/PasswordVerificationStep'
          emailVerification: '#/components/schemas/EmailVerificationStep'
          totpVerification: '#/components/schemas/TotpVerificationStep'
          backupCodeVerification: '#/components/schemas/BackupCodeVerificationStep'
          googleVerification: '#/components/schemas/GoogleVerificationStep'
          vkVerification: '#/components/schemas/VkVerificationStep'
          passkeyVerification: '#/components/schemas/PasskeyVerificationStep'
      description: Typed step state, with type-specific fields at the same level as
        id/type/status. Successful completion is a state transition, not necessarily
        completion of the whole process. OAuth setup secrets appear only in the creation
        response, never in GET or authentication.steps.

    StartRegistrationStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - registration
      required:
        - type
      additionalProperties: false

    StartPasswordSetupStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - passwordSetup
      required:
        - type
      additionalProperties: false

    StartPasswordVerificationStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - passwordVerification
      required:
        - type
      additionalProperties: false

    StartEmailVerificationStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - emailVerification
      required:
        - type
      additionalProperties: false

    StartTotpVerificationStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - totpVerification
      required:
        - type
      additionalProperties: false

    StartBackupCodeVerificationStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - backupCodeVerification
      required:
        - type
      additionalProperties: false

    GoogleVerificationStepOption:
      type: object
      properties:
        type:
          type: string
          enum:
            - googleVerification
      required:
        - type
      additionalProperties: false

    StartGoogleVerificationStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - googleVerification
        redirectUri:
          type: string
          format: uri
        credentialType:
          type: string
          enum:
            - authorizationCode
            - idToken
          default: authorizationCode
      required:
        - type
      additionalProperties: false
      oneOf:
        - properties:
            credentialType:
              type: string
              enum:
                - authorizationCode
          required:
            - redirectUri
        - properties:
            credentialType:
              type: string
              enum:
                - idToken
          required:
            - credentialType
          not:
            required:
              - redirectUri
      description: Authorization code is the default and requires an exact allowlisted
        redirectUri. Native idToken requires a nonce-capable supported SDK; redirectUri
        is forbidden for this mode. The server binds the chosen mode to the step.

    VkVerificationStepOption:
      type: object
      properties:
        type:
          type: string
          enum:
            - vkVerification
      required:
        - type
      additionalProperties: false

    StartVkVerificationStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - vkVerification
        redirectUri:
          type: string
          format: uri
        credentialType:
          type: string
          enum:
            - authorizationCode
          default: authorizationCode
      required:
        - type
        - redirectUri
      additionalProperties: false
      description: Authorization-code mode only; redirectUri must match an exact allowlist
        entry. Server-held state and PKCE where supported are required.

    StartPasskeyVerificationStepRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - passkeyVerification
      required:
        - type
      additionalProperties: false

    RegistrationStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - registration
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - expirationTimestamp
      additionalProperties: false
      description: Collect only email. No account lookup result is disclosed. Completing
        this step fixes the email for this process; changing it requires a new process.

    PasswordSetupStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - passwordSetup
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - expirationTimestamp
      additionalProperties: false
      description: Set the first password for a new account after verifying its email
        in this process. Never reset or modify an existing account through signUp.

    PasswordVerificationStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - passwordVerification
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - expirationTimestamp
      additionalProperties: false

    EmailVerificationStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - emailVerification
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
        codeLength:
          type: integer
          minimum: 6
          maximum: 6
      required:
        - id
        - type
        - status
        - expirationTimestamp
        - codeLength
      additionalProperties: false

    TotpVerificationStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - totpVerification
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - expirationTimestamp
      additionalProperties: false

    BackupCodeVerificationStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - backupCodeVerification
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
      required:
        - id
        - type
        - status
        - expirationTimestamp
      additionalProperties: false

    GoogleVerificationStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - googleVerification
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        nonce:
          type: string
          minLength: 1
      required:
        - id
        - type
        - status
        - expirationTimestamp
      additionalProperties: false
      description: Creation returns exactly url for authorizationCode or nonce for
        idToken. Both are omitted on all subsequent reads. The ID-token nonce must
        be validated inside the provider-signed token, not echoed as a proof.
      not:
        required:
          - url
          - nonce

    VkVerificationStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - vkVerification
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
        url:
          type: string
          format: uri
      required:
        - id
        - type
        - status
        - expirationTimestamp
      additionalProperties: false
      description: url is returned only at creation and omitted on subsequent reads.

    PasskeyVerificationStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - passkeyVerification
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
        publicKey:
          $ref: '#/components/schemas/PasskeyRequestOptions'
      required:
        - id
        - type
        - status
        - expirationTimestamp
        - publicKey
      additionalProperties: false

    AuthenticationPurpose:
      oneOf:
        - $ref: '#/components/schemas/SignInPurpose'
        - $ref: '#/components/schemas/SignUpPurpose'
        - $ref: '#/components/schemas/PasswordChangePurpose'
        - $ref: '#/components/schemas/EmailChangePurpose'
        - $ref: '#/components/schemas/AccountDeletionPurpose'
        - $ref: '#/components/schemas/TotpEnrollmentPurpose'
        - $ref: '#/components/schemas/TotpRemovalPurpose'
        - $ref: '#/components/schemas/PasskeyEnrollmentPurpose'
        - $ref: '#/components/schemas/PasskeyRemovalPurpose'
        - $ref: '#/components/schemas/BackupCodesRotationPurpose'
        - $ref: '#/components/schemas/IdentityLinkPurpose'
        - $ref: '#/components/schemas/IdentityUnlinkPurpose'
      discriminator:
        propertyName: type
        mapping:
          signIn: '#/components/schemas/SignInPurpose'
          signUp: '#/components/schemas/SignUpPurpose'
          passwordChange: '#/components/schemas/PasswordChangePurpose'
          emailChange: '#/components/schemas/EmailChangePurpose'
          accountDeletion: '#/components/schemas/AccountDeletionPurpose'
          totpEnrollment: '#/components/schemas/TotpEnrollmentPurpose'
          totpRemoval: '#/components/schemas/TotpRemovalPurpose'
          passkeyEnrollment: '#/components/schemas/PasskeyEnrollmentPurpose'
          passkeyRemoval: '#/components/schemas/PasskeyRemovalPurpose'
          backupCodesRotation: '#/components/schemas/BackupCodesRotationPurpose'
          identityLink: '#/components/schemas/IdentityLinkPurpose'
          identityUnlink: '#/components/schemas/IdentityUnlinkPurpose'

    SignInPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - signIn
      required:
        - type
      additionalProperties: false

    SignUpPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - signUp
      required:
        - type
      additionalProperties: false

    PasswordChangePurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - passwordChange
      required:
        - type
      additionalProperties: false

    EmailChangePurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - emailChange
      required:
        - type
      additionalProperties: false

    AccountDeletionPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - accountDeletion
      required:
        - type
      additionalProperties: false

    TotpEnrollmentPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - totpEnrollment
      required:
        - type
      additionalProperties: false

    TotpRemovalPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - totpRemoval
      required:
        - type
      additionalProperties: false

    PasskeyEnrollmentPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - passkeyEnrollment
      required:
        - type
      additionalProperties: false

    PasskeyRemovalPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - passkeyRemoval
      required:
        - type
      additionalProperties: false

    BackupCodesRotationPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - backupCodesRotation
      required:
        - type
      additionalProperties: false

    IdentityLinkPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - identityLink
      required:
        - type
      additionalProperties: false

    IdentityUnlinkPurpose:
      type: object
      properties:
        type:
          type: string
          enum:
            - identityUnlink
      required:
        - type
      additionalProperties: false

    StartAuthenticationRequest:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/AuthenticationPurpose'
      required:
        - purpose
      additionalProperties: false
      description: Start only the process. Registration data and credentials are supplied
        through typed steps, never here. signIn/signUp are public; all other purposes
        require the originating access bearer. No client/device fields.

    AuthenticationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/AuthenticationPurpose'
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - cancelled
        expirationTimestamp:
          type: string
          format: date-time
        next:
          $ref: '#/components/schemas/AuthenticationNext'
        flowToken:
          type: string
          minLength: 1
          description: Returned only by creation, never GET. Keep in the initiating
            flow; do not log or persist in general app state.
        confirmationToken:
          type: string
          minLength: 1
          description: Single-use grant returned only by the mutation completing the
            process. GET never returns it.
        confirmationExpirationTimestamp:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationStep'
          description: Created steps in creation order; empty at process creation.
            Read-safe representations never repeat OAuth URLs/nonces, submitted secrets
            or final grants.
      required:
        - id
        - purpose
        - status
        - expirationTimestamp
        - next
        - steps
      additionalProperties: false
      description: The server controls transitions. next.options lists alternatives
        for the next action, not all mandatory factors. Completing a data-collection
        or setup step is not authentication evidence. Terminal processes have empty
        options. Tokens for a session are obtained separately with POST /v1/sessions.

    AuthenticationNext:
      type: object
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationStepOption'
      required:
        - options
      additionalProperties: false
      description: Server-advertised alternative step types. Empty after termination.
        A pending emailVerification may be offered again for resend. Before email
        ownership is proved, signUp responses and options must be independent of account
        existence. For signIn, do not reveal account-specific factors before a successful
        first proof. Unsupported or unconfigured types are never offered; unknown
        types require a client update, never skipping the step.

    BackupCodesStatusResponse:
      type: object
      properties:
        remainingCount:
          type: integer
          minimum: 0
        generationTimestamp:
          type: string
          format: date-time
          nullable: true
      required:
        - remainingCount
        - generationTimestamp
      additionalProperties: false

    BackupCodesResponse:
      type: object
      properties:
        backupCodes:
          type: array
          items:
            type: string
            minLength: 1
        generationTimestamp:
          type: string
          format: date-time
      required:
        - backupCodes
        - generationTimestamp
      additionalProperties: false
      description: Plaintext codes shown once. Replaces the entire previous set atomically.
        Codes are second-factor recovery, not a primary sign-in credential.

    AccountRestriction:
      oneOf:
        - $ref: '#/components/schemas/PendingDeletionRestriction'
      discriminator:
        propertyName: type
        mapping:
          pendingDeletion: '#/components/schemas/PendingDeletionRestriction'

    PendingDeletionRestriction:
      type: object
      properties:
        type:
          type: string
          enum:
            - pendingDeletion
        deletionTimestamp:
          type: string
          format: date-time
          description: Scheduled account deletion deadline.
        deleteSharedData:
          type: boolean
          description: Stored content deletion policy at token issuance.
      required:
        - type
        - deletionTimestamp
        - deleteSharedData

    RequestEmailChangeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
      additionalProperties: false

    ConfirmEmailChangeRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
      required:
        - token
      additionalProperties: false

    ConfirmEmailChangeResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - pendingNewEmail
            - changed
      required:
        - status
      additionalProperties: false

    IdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
      required:
        - identities

    Identity:
      description: A linked external account. The provider determines the representation
        of its user identifier.
      oneOf:
        - $ref: '#/components/schemas/GoogleIdentity'
        - $ref: '#/components/schemas/VkIdentity'
      discriminator:
        propertyName: provider
        mapping:
          google: '#/components/schemas/GoogleIdentity'
          vk: '#/components/schemas/VkIdentity'

    GoogleIdentity:
      type: object
      properties:
        provider:
          type: string
          enum:
            - google
        id:
          type: string
          description: Google user identifier (sub claim), not the application client
            ID.
      required:
        - provider
        - id

    VkIdentity:
      type: object
      properties:
        provider:
          type: string
          enum:
            - vk
        id:
          type: integer
          format: int64
          description: VK user identifier, not the application ID.
      required:
        - provider
        - id

    LinkGoogleIdentityRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          writeOnly: true
        state:
          type: string
          minLength: 1
          writeOnly: true
      required:
        - code
        - state
      additionalProperties: false
      description: Code/state from this session's POST /oauth/google. Native ID-token
        login uses an authentication challenge; an unbound ID token cannot link an
        identity.

    LinkVkIdentityRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
      required:
        - code
        - state
      additionalProperties: false

    CreateAuthorizationUrlRequest:
      type: object
      properties:
        redirectUri:
          type: string
          format: uri
      required:
        - redirectUri
      additionalProperties: false
      description: Exact allowlisted callback URI. Browser/client flow binding is
        enforced by the server; arbitrary redirect URIs are rejected. This operation
        only prepares linking for the authenticated session.

    CreateAuthorizationUrlResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
        expirationTimestamp:
          type: string
          format: date-time
      required:
        - url
        - expirationTimestamp
      additionalProperties: false

    PasskeysResponse:
      type: object
      properties:
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/Passkey'
      required:
        - passkeys
      additionalProperties: false

    Passkey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        creationTimestamp:
          type: string
          format: date-time
        lastUseTimestamp:
          type: string
          format: date-time
          nullable: true
        transports:
          type: array
          items:
            type: string
        backupEligible:
          type: boolean
        backupState:
          type: boolean
      required:
        - id
        - name
        - creationTimestamp
        - lastUseTimestamp
        - transports
        - backupEligible
        - backupState
      additionalProperties: false

    RenamePasskeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
      additionalProperties: false

    RequestPasskeyRegistrationResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        expirationTimestamp:
          type: string
          format: date-time
        publicKey:
          $ref: '#/components/schemas/PasskeyCreationOptions'
      required:
        - requestId
        - expirationTimestamp
        - publicKey
      additionalProperties: false

    ConfirmPasskeyRegistrationRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        credential:
          $ref: '#/components/schemas/PasskeyAttestation'
      required:
        - requestId
        - name
        - credential
      additionalProperties: false

    PasskeyCredentialDescriptor:
      type: object
      properties:
        type:
          type: string
          enum:
            - public-key
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        transports:
          type: array
          items:
            type: string
      required:
        - type
        - id
      additionalProperties: false

    PasskeyRequestOptions:
      type: object
      properties:
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        rpId:
          type: string
          minLength: 1
        timeout:
          type: integer
          minimum: 1
        userVerification:
          type: string
          enum:
            - required
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyCredentialDescriptor'
      required:
        - challenge
        - rpId
        - userVerification
      additionalProperties: false
      description: WebAuthn PublicKeyCredentialRequestOptionsJSON. Empty/absent allowCredentials
        enables discoverable credentials. Account selection must not leak before proof.

    PasskeyCreationOptions:
      type: object
      properties:
        rp:
          $ref: '#/components/schemas/PasskeyRelyingParty'
        user:
          $ref: '#/components/schemas/PasskeyUser'
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        pubKeyCredParams:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyAlgorithm'
        timeout:
          type: integer
          minimum: 1
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyCredentialDescriptor'
        authenticatorSelection:
          $ref: '#/components/schemas/PasskeyAuthenticatorSelection'
        attestation:
          type: string
          enum:
            - none
      required:
        - rp
        - user
        - challenge
        - pubKeyCredParams
        - authenticatorSelection
        - attestation
      additionalProperties: false

    PasskeyRelyingParty:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      required:
        - id
        - name
      additionalProperties: false

    PasskeyUser:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        name:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
      required:
        - id
        - name
        - displayName
      additionalProperties: false
      description: id is the binary immutable account UUID encoded as base64url, never
        email. Passkeys can only be registered for an existing account after signUp
        is complete. Preserve the account UUID across schema changes.

    PasskeyAlgorithm:
      type: object
      properties:
        type:
          type: string
          enum:
            - public-key
        alg:
          type: integer
          description: COSE algorithm identifier accepted by the server.
      required:
        - type
        - alg
      additionalProperties: false

    PasskeyAuthenticatorSelection:
      type: object
      properties:
        residentKey:
          type: string
          enum:
            - required
        userVerification:
          type: string
          enum:
            - required
      required:
        - residentKey
        - userVerification
      additionalProperties: false

    PasskeyAssertion:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        rawId:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        type:
          type: string
          enum:
            - public-key
        response:
          $ref: '#/components/schemas/PasskeyAssertionResponse'
        authenticatorAttachment:
          type: string
          enum:
            - platform
            - cross-platform
        clientExtensionResults:
          type: object
          additionalProperties: true
          description: WebAuthn standard extension outputs. These are not arbitrary
            authentication context or trusted claims.
      required:
        - id
        - rawId
        - type
        - response
      additionalProperties: false

    PasskeyAssertionResponse:
      type: object
      properties:
        clientDataJSON:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        authenticatorData:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        userHandle:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
          nullable: true
      required:
        - clientDataJSON
        - authenticatorData
        - signature
      additionalProperties: false

    PasskeyAttestation:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        rawId:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        type:
          type: string
          enum:
            - public-key
        response:
          $ref: '#/components/schemas/PasskeyAttestationResponse'
        authenticatorAttachment:
          type: string
          enum:
            - platform
            - cross-platform
        clientExtensionResults:
          type: object
          additionalProperties: true
      required:
        - id
        - rawId
        - type
        - response
      additionalProperties: false

    PasskeyAttestationResponse:
      type: object
      properties:
        clientDataJSON:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        attestationObject:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        transports:
          type: array
          items:
            type: string
        publicKeyAlgorithm:
          type: integer
        publicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
        authenticatorData:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Unpadded base64url bytes; not standard base64.
      required:
        - clientDataJSON
        - attestationObject
      additionalProperties: false

