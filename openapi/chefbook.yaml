        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/sessions/{id}/tokens:
    post:
      operationId: refreshSessionTokens
      summary: Refresh session tokens
      tags:
        - auth
      security: []
      description: |-
        Refresh token must belong to path id. Atomically rotate once preserving userId/sessionId. Invalid/rotated/expired refresh or mismatch is 400 invalid_refresh_token; no 404. Malformed request must not revoke a session.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Refresh the current session

        The URL id must identify this refresh token’s session. Replace the locally stored token pair with the response; do not reuse the old refresh token.

        Content-Type: `application/json`

        ```json
        {
          "refreshToken": "example-current-refresh-token"
        }
        ```
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionTokensRequest'
            examples:
              rotate:
                summary: Refresh the current session
                description: The URL id must identify this refresh token’s session.
                  Replace the locally stored token pair with the response; do not
                  reuse the old refresh token.
                value:
                  refreshToken: example-current-refresh-token
      responses:
        '200':
          description: Rotate session tokens
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'

        '400':
          description: Malformed request or invalid proof. Unrecognized login and
            wrong password return the same invalid_credentials error without revealing
            account state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRefreshToken:
                  value:
                    error: invalid_refresh_token
                    message: The refresh token cannot be used
                invalidRequest:
                  value:
                    error: invalid_request
                    message: Invalid request body

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

