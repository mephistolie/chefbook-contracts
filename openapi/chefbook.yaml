    post:
      operationId: requestPasswordReset
      summary: Request a password reset
      tags:
        - auth
      security: []
      description: |-
        Neutral response for unknown and known emails. Queue mail, do not disclose account existence. No session created.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Request a reset email

        Public endpoint. The accepted response does not disclose whether an account exists.

        Content-Type: `application/json`

        ```json
        {
          "email": "alex.smith@example.com"
        }
        ```

        #### Unknown or non-eligible email

        Same public response as for an eligible account; this is not an account-discovery endpoint.

        Content-Type: `application/json`

        ```json
        {
          "email": "nobody@example.com"
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
            examples:
              knownEmail:
                summary: Request a reset email
                description: Public endpoint. The accepted response does not disclose
                  whether an account exists.
                value:
                  email: alex.smith@example.com
              unknownEmail:
                summary: Unknown or non-eligible email
                description: Same public response as for an eligible account; this
                  is not an account-discovery endpoint.
                value:
                  email: nobody@example.com
      responses:
        '202':
