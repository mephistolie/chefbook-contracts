  /v1/account/deletion:
    post:
      operationId: requestAccountDeletion
      summary: Request account deletion
      tags:
        - auth
      security:
        - bearerAuth: []
          reauthenticationAuth: []
      description: |-
        Schedule account deletion using an accountDeletion grant bound to the current account and session. Return the deletion deadline and deleteSharedData preference; this request does not immediately delete the account.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Preserve shared content used by others

        Send Bearer and an accountDeletion Reauthentication-Token. Eligible shared content is retained with a deleted-profile author; other owned content is removed.

        Content-Type: `application/json`

        ```json
        {
          "deleteSharedData": false
        }
        ```

        #### Delete shared content too

        Send Bearer and an accountDeletion Reauthentication-Token. Owned originals and their bookmarks are removed.

        Content-Type: `application/json`

        ```json
        {
          "deleteSharedData": true
        }
        ```

        #### Use the default deletion policy

        Omitting deleteSharedData means false. The same Bearer and reauthentication requirements apply.

        Content-Type: `application/json`

        ```json
        {}
        ```
      parameters:
        - name: Reauthentication-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Single-use confirmation token for this action, bound to the
            current account and access session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAccountDeletionRequest'
            examples:
              preserveShared:
                summary: Preserve shared content used by others
                description: Send Bearer and an accountDeletion Reauthentication-Token.
                  Eligible shared content is retained with a deleted-profile author;
                  other owned content is removed.
                value:
                  deleteSharedData: false
              deleteShared:
                summary: Delete shared content too
                description: Send Bearer and an accountDeletion Reauthentication-Token.
                  Owned originals and their bookmarks are removed.
                value:
                  deleteSharedData: true
              defaultPolicy:
                summary: Use the default deletion policy
                description: Omitting deleteSharedData means false. The same Bearer
                  and reauthentication requirements apply.
                value: {}
      responses:
        '202':
          description: Schedule account deletion
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '409':
          $ref: '#/components/responses/Conflict'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    patch:
      operationId: updateAccountDeletion
      summary: Update account deletion preferences
      tags:
        - auth
      security:
        - bearerAuth: []
      description: |-
        Change only deleteSharedData on an existing deletion request. Keep the original deletion deadline. Requires the current access bearer; no new reauthentication grant is needed.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Preserve shared content used by others

        Send Bearer; no new reauthentication is required for an existing deletion request. The deletion deadline does not move. Eligible shared content is retained with a deleted-profile author; other owned content is removed.

        Content-Type: `application/json`

        ```json
        {
          "deleteSharedData": false
        }
        ```

        #### Delete shared content too

        Send Bearer; no new reauthentication is required for an existing deletion request. The deletion deadline does not move. Owned originals and their bookmarks are removed.

        Content-Type: `application/json`

        ```json
        {
          "deleteSharedData": true
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountDeletionRequest'
            examples:
              preserveShared:
                summary: Preserve shared content used by others
                description: Send Bearer; no new reauthentication is required for
                  an existing deletion request. The deletion deadline does not move.
                  Eligible shared content is retained with a deleted-profile author;
                  other owned content is removed.
                value:
                  deleteSharedData: false
              deleteShared:
                summary: Delete shared content too
                description: Send Bearer; no new reauthentication is required for
                  an existing deletion request. The deletion deadline does not move.
                  Owned originals and their bookmarks are removed.
                value:
                  deleteSharedData: true
      responses:
        '200':
          description: Change content deletion preference
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      operationId: cancelAccountDeletion
      summary: Cancel account deletion
      tags:
        - auth
      security:
        - bearerAuth: []
      description: Cancel pending deletion using the current access bearer. Also return
        204 when no request exists. Cancellation cannot recover an account after permanent
