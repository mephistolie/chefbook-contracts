  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshTokenAuth:
      type: http
      scheme: bearer
      description: Opaque refresh bearer, only DELETE /v1/sessions/{id}; must identify
        that exact session.
    flowTokenAuth:
      type: apiKey
      in: header
      name: Flow-Token
      description: Opaque secret for one authentication flow. Reauthentication additionally
        requires its original access bearer; IDs are not authorization.
    reauthenticationAuth:
      type: apiKey
      in: header
      name: Reauthentication-Token
      description: Short-lived single-use purpose/account/session-bound grant, in
        addition to access bearer.

  responses:
    Unauthorized:
      description: Authentication credentials required by this operation are missing,
        invalid or expired. For operations with conditional authentication, this response
        applies only to scenarios requiring credentials.
      headers:
        WWW-Authenticate:
          description: Required on every 401 response from an operation using Bearer
            authentication. Use the token type required by that operation. Missing
            credentials receive the bare Bearer challenge; invalid or expired tokens
            may include error="invalid_token". For conditional authentication this
            applies only to scenarios requiring credentials.
          required: true
          schema:
            type: string
          examples:
            missingCredentials:
              value: Bearer
            invalidToken:
              value: Bearer error="invalid_token"
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request is malformed or contains an invalid proof. See the
        operation description and error code for the specific failure.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The operation is not allowed for this account or session, or the
        required confirmation grant is missing, expired, consumed or bound to another
        action or session.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The requested operation conflicts with the current resource state.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required dependency or integration is unavailable. This does
        not indicate invalid credentials.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is not accessible to this caller.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: The request or attempt limit was reached. Wait at least Retry-After
        seconds before retrying.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Pragma:
          $ref: '#/components/headers/PragmaNoCache'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  headers:
    CacheControlNoStore:
      description: Do not store this response in HTTP caches.
      required: true
      schema:
        type: string
        enum:
          - no-store
      example: no-store
    PragmaNoCache:
      description: 'Legacy cache-control compatibility header accompanying Cache-Control:
        no-store.'
      required: true
      schema:
        type: string
        enum:
          - no-cache
      example: no-cache
    RetryAfter:
      description: Minimum delay in seconds before retrying. Retry with backoff; this
        is not a guarantee of admission after the delay.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 60

