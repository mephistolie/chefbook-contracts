        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Request Password Reset
      tags:
      - auth
      x-codegen-request-body-name: input
      operationId: requestPasswordReset
      security: []
    put:
      description: Change password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChangePasswordRequest'
        description: Code and new password
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      summary: Change Password
      tags:
      - auth
      x-codegen-request-body-name: input
      operationId: changePassword
  /v1/auth/refresh:
    post:
      description: Refresh session to get new tokens pair
      requestBody:
