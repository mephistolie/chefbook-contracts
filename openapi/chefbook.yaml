      operationId: revokeSession
      summary: Revoke session
      tags:
        - auth
      security:
        - bearerAuth: []
        - refreshTokenAuth: []
      description: Access bearer may revoke an own session; refresh bearer may only
        revoke its exact path session. Unknown/revoked well-formed refresh returns
        204 without effect. An inaccessible session is treated as absent. Missing/malformed
        bearer is 401. No DELETE body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: No Content
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'

