      summary: Set password
      tags:
        - auth
      security:
        - bearerAuth: []
        - bearerAuth: []
          reauthenticationAuth: []
      description: |-
        Existing password requires passwordChange grant; first password may be set with full bearer alone only while stored hash is NULL. Concurrency must preserve this condition. Credential changes revoke existing trust and do not disable MFA. Repeating identical desired state must not reset timestamps or repeat side effects.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Set a first password

        For an account without a password, the current Bearer is sufficient; no Reauthentication-Token is required.

        Content-Type: `application/json`

        ```json
        {
          "newPassword": "Example-only-Password-42!"
        }
        ```

        #### Replace an existing password

        Send the current Bearer and a passwordChange Reauthentication-Token. The request body does not contain the old password.

        Content-Type: `application/json`

        ```json
        {
          "newPassword": "Another-example-Password-73!"
        }
        ```
