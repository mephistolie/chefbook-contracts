openapi: 3.0.3

info:
  contact:
    email: support@chefbook.io
    name: ChefBook API Support
  description: ChefBook API for account security, recipes and shared collections.
    Authentication uses explicit challenges; sessions are issued only after all required
    checks succeed.
  title: ChefBook API
  version: 0.5.0-draft

servers:
  - url: /
    description: Current gateway origin; clients configure their own base URL

tags:
  - name: auth
    x-displayName: Authentication
  - name: collection
    x-displayName: Collection
  - name: recipe
    x-displayName: Recipe
  - name: encryption
    x-displayName: Encryption
  - name: shoppingList
    x-displayName: Shopping list
  - name: subscription
    x-displayName: Subscription
  - name: profile
    x-displayName: Profile
  - name: tag
    x-displayName: Tag

paths:
  /v1/authentications:
    post:
      operationId: startAuthentication
      summary: Start authentication
      tags:
        - auth
      security:
        - {}
        - bearerAuth: []
      description: |-
        Start a process with purpose only. signIn/signUp are public; other purposes require the originating access bearer. signUp first offers registration, with no account or session created. Registration data and all credentials arrive through steps. Recent sufficient proof from the same original session may finish reauthentication immediately, without extending evidence freshness. Before proof, responses must not disclose account existence or enrolled factors.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Sign in

        Public start. Choose a permitted step from the response; supply the login only when completing a password step.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "signIn"
          }
        }
        ```

        #### Reauthenticate: change or set password

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "passwordChange"
          }
        }
        ```

        #### Reauthenticate: change email

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "emailChange"
          }
        }
        ```

        #### Reauthenticate: schedule account deletion

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "accountDeletion"
          }
        }
        ```

        #### Reauthenticate: activate TOTP

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "totpEnrollment"
          }
        }
        ```

        #### Reauthenticate: remove TOTP

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "totpRemoval"
          }
        }
        ```

        #### Reauthenticate: register a passkey

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "passkeyEnrollment"
          }
        }
        ```

        #### Reauthenticate: remove a passkey

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "passkeyRemoval"
          }
        }
        ```

        #### Reauthenticate: replace backup codes

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "backupCodesRotation"
          }
        }
        ```

        #### Reauthenticate: link an external identity

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "identityLink"
          }
        }
        ```

        #### Reauthenticate: unlink an external identity

        Send Authorization: Bearer with the originating session. Reuse recent evidence only if accepted by the server; otherwise complete the offered steps. Use the resulting confirmationToken for this purpose and session.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "identityUnlink"
          }
        }
        ```

        #### Start registration without credentials

        Only purpose. Complete registration with an email, then verify its code in this process before setting a password. Passkeys and external identities can be added after registration. No username is accepted.

        Content-Type: `application/json`

        ```json
        {
          "purpose": {
            "type": "signUp"
          }
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAuthenticationRequest'
            examples:
              signIn:
                summary: Sign in
                description: Public start. Choose a permitted step from the response;
                  supply the login only when completing a password step.
                value:
                  purpose:
                    type: signIn
              passwordChange:
                summary: 'Reauthenticate: change or set password'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: passwordChange
              emailChange:
                summary: 'Reauthenticate: change email'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: emailChange
              accountDeletion:
                summary: 'Reauthenticate: schedule account deletion'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: accountDeletion
              totpEnrollment:
                summary: 'Reauthenticate: activate TOTP'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: totpEnrollment
              totpRemoval:
                summary: 'Reauthenticate: remove TOTP'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: totpRemoval
              passkeyEnrollment:
                summary: 'Reauthenticate: register a passkey'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: passkeyEnrollment
              passkeyRemoval:
                summary: 'Reauthenticate: remove a passkey'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: passkeyRemoval
              backupCodesRotation:
                summary: 'Reauthenticate: replace backup codes'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: backupCodesRotation
              identityLink:
                summary: 'Reauthenticate: link an external identity'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: identityLink
              identityUnlink:
                summary: 'Reauthenticate: unlink an external identity'
                description: 'Send Authorization: Bearer with the originating session.
                  Reuse recent evidence only if accepted by the server; otherwise
                  complete the offered steps. Use the resulting confirmationToken
                  for this purpose and session.'
                value:
                  purpose:
                    type: identityUnlink
              signUp:
                summary: Start registration without credentials
                description: Only purpose. Complete registration with an email, then
                  verify its code in this process before setting a password. Passkeys
                  and external identities can be added after registration. No username
                  is accepted.
                value:
                  purpose:
                    type: signUp
      responses:
        '201':
          description: Begin authentication
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Location:
              required: true
              description: /v1/authentications/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
              examples:
                signUp:
                  summary: Registration starts without email or credentials
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    purpose:
                      type: signUp
                    status: pending
                    expirationTimestamp: '2026-09-19T12:15:00Z'
                    next:
                      options:
                        - type: registration
                    steps: []
                    flowToken: example-only-flow-token

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/authentications/{id}:
    get:
      operationId: getAuthentication
      summary: Get authentication state
      tags:
        - auth
      security:
        - flowTokenAuth: []
        - flowTokenAuth: []
          bearerAuth: []
      description: Flow-Token always required. For sensitive purposes also require
        original access bearer (AND). Invalid flow secrets return 404 without disclosure;
        missing/invalid required bearer returns 401. GET never returns flowToken/confirmationToken
        or extends expiry.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Flow-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Secret of this originating flow. Bearer is additionally required
            for reauthentication.
      responses:
        '200':
          description: Read authentication state
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/authentications/{id}/steps:
    post:
      operationId: startAuthenticationStep
      summary: Start authentication step
      tags:
        - auth
      security:
        - flowTokenAuth: []
        - flowTokenAuth: []
          bearerAuth: []
      description: |-
        Flow-Token is required; sensitive purposes also require the original access bearer. Only server-advertised next.options are allowed. Starting a registration step does not send email. Starting emailVerification queues a code for both existing and unused addresses with indistinguishable public responses and rate-limit behavior. Resend creates a replacement step and cancels its pending predecessor in this process, without resetting total failed attempts or expiry. 201 acknowledges creation, not email delivery. Password setup for signUp is forbidden until email ownership is verified. Passkeys and external identities can only be added after account creation. Concurrent alternatives must not bypass server policy.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Password

        Send Flow-Token; sensitive purposes also require the original Bearer. Credentials are supplied when completing this step.

        Content-Type: `application/json`

        ```json
        {
          "type": "passwordVerification"
        }
        ```

        #### Email code

        Send Flow-Token; sensitive purposes also require the original Bearer. Registration only: sends a code to the email from this flow. Complete it in the same initiating flow; respect Retry-After when resending.

        Content-Type: `application/json`

        ```json
        {
          "type": "emailVerification"
        }
        ```

        #### TOTP second factor

        Use only when next.options offers totpVerification after the first factor. Send Flow-Token and, for sensitive purposes, the original Bearer.

        Content-Type: `application/json`

        ```json
        {
          "type": "totpVerification"
        }
        ```

        #### Backup code

        Send Flow-Token; sensitive purposes also require the original Bearer. Use an unused backup code when offered as an alternative to the second factor.

        Content-Type: `application/json`

        ```json
        {
          "type": "backupCodeVerification"
        }
        ```

        #### Passkey

        Send Flow-Token; sensitive purposes also require the original Bearer. Pass the returned publicKey options to WebAuthn or the native passkey API.

        Content-Type: `application/json`

        ```json
        {
          "type": "passkeyVerification"
        }
        ```

        #### Google: authorization code

        The callback must exactly match the configured allowlist. Open the returned URL, then submit both code and state. Requires provider setup.

        Content-Type: `application/json`

        ```json
        {
          "type": "googleVerification",
          "credentialType": "authorizationCode",
          "redirectUri": "https://app.example.com/oauth/google/callback"
        }
        ```

        #### Google: default credential type

        Omitting credentialType selects authorizationCode. This app callback is illustrative and must be explicitly allowlisted; it is not an ID-token request.

        Content-Type: `application/json`

        ```json
        {
          "type": "googleVerification",
          "redirectUri": "chefbook://oauth/google"
        }
        ```

        #### VK: authorization code

        The callback must exactly match the configured allowlist. Open the returned URL, then submit both code and state. Requires provider setup.

        Content-Type: `application/json`

        ```json
        {
          "type": "vkVerification",
          "credentialType": "authorizationCode",
          "redirectUri": "https://app.example.com/oauth/vk/callback"
        }
        ```

        #### VK: default credential type

        Omitting credentialType selects authorizationCode. This app callback is illustrative and must be explicitly allowlisted; it is not an ID-token request.

        Content-Type: `application/json`

        ```json
        {
          "type": "vkVerification",
          "redirectUri": "chefbook://oauth/vk"
        }
        ```

        #### Google: native ID token

        Use the returned nonce in the provider SDK. Only a nonce-bound ID token is accepted; requires an SDK that supports this flow.

        Content-Type: `application/json`

        ```json
        {
          "type": "googleVerification",
          "credentialType": "idToken"
        }
        ```

        #### Collect an email for registration

        Content-Type: `application/json`

        ```json
        {
          "type": "registration"
        }
        ```

        #### Set the first password after email verification

        Content-Type: `application/json`

        ```json
        {
          "type": "passwordSetup"
        }
        ```
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Flow-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Secret of this originating flow. Bearer is additionally required
            for reauthentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAuthenticationStepRequest'
            examples:
              password:
                summary: Password
                description: Send Flow-Token; sensitive purposes also require the
                  original Bearer. Credentials are supplied when completing this step.
                value:
                  type: passwordVerification
              email:
                summary: Email code
                description: 'Send Flow-Token; sensitive purposes also require the
                  original Bearer. Registration only: sends a code to the email from
                  this flow. Complete it in the same initiating flow; respect Retry-After
                  when resending.'
                value:
                  type: emailVerification
              totp:
                summary: TOTP second factor
                description: Use only when next.options offers totpVerification after
                  the first factor. Send Flow-Token and, for sensitive purposes, the
                  original Bearer.
                value:
                  type: totpVerification
              backupCode:
                summary: Backup code
                description: Send Flow-Token; sensitive purposes also require the
                  original Bearer. Use an unused backup code when offered as an alternative
                  to the second factor.
                value:
                  type: backupCodeVerification
              passkey:
                summary: Passkey
                description: Send Flow-Token; sensitive purposes also require the
                  original Bearer. Pass the returned publicKey options to WebAuthn
                  or the native passkey API.
                value:
                  type: passkeyVerification
              googleCode:
                summary: 'Google: authorization code'
                description: The callback must exactly match the configured allowlist.
                  Open the returned URL, then submit both code and state. Requires
                  provider setup.
                value:
                  type: googleVerification
                  credentialType: authorizationCode
                  redirectUri: https://app.example.com/oauth/google/callback
              googleDefault:
                summary: 'Google: default credential type'
                description: Omitting credentialType selects authorizationCode. This
                  app callback is illustrative and must be explicitly allowlisted;
                  it is not an ID-token request.
                value:
                  type: googleVerification
                  redirectUri: chefbook://oauth/google
              vkCode:
                summary: 'VK: authorization code'
                description: The callback must exactly match the configured allowlist.
                  Open the returned URL, then submit both code and state. Requires
                  provider setup.
                value:
                  type: vkVerification
                  credentialType: authorizationCode
                  redirectUri: https://app.example.com/oauth/vk/callback
              vkDefault:
                summary: 'VK: default credential type'
                description: Omitting credentialType selects authorizationCode. This
                  app callback is illustrative and must be explicitly allowlisted;
                  it is not an ID-token request.
                value:
                  type: vkVerification
                  redirectUri: chefbook://oauth/vk
              googleNative:
                summary: 'Google: native ID token'
                description: Use the returned nonce in the provider SDK. Only a nonce-bound
                  ID token is accepted; requires an SDK that supports this flow.
                value:
                  type: googleVerification
                  credentialType: idToken
              registration:
                summary: Collect an email for registration
                value:
                  type: registration
              passwordSetup:
                summary: Set the first password after email verification
                value:
                  type: passwordSetup
      responses:
        '201':
          description: Create a typed authentication step
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
            Location:
              required: true
              description: /v1/authentications/{id}/steps/{stepId}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationStep'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'

        '409':
          $ref: '#/components/responses/Conflict'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/authentications/{id}/steps/{stepId}:
    get:
      operationId: getAuthenticationStep
      summary: Get authentication step state
      tags:
        - auth
      security:
        - flowTokenAuth: []
        - flowTokenAuth: []
          bearerAuth: []
      description: Read a step belonging to this process using Flow-Token and, for
        sensitive purposes, the original bearer. Never replay submitted passwords/codes,
        OAuth URL/nonce or final grants. This read sends no messages and changes no
        state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Flow-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Secret of this originating flow. Bearer is additionally required
            for reauthentication.
      responses:
        '200':
          description: Read typed step state
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Pragma:
              $ref: '#/components/headers/PragmaNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationStep'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'

        '429':
          $ref: '#/components/responses/TooManyRequests'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/authentications/{id}/steps/{stepId}/completion:
    post:
      operationId: completeAuthenticationStep
      summary: Complete authentication step
      tags:
        - auth
      security:
        - flowTokenAuth: []
        - flowTokenAuth: []
          bearerAuth: []
      description: |-
        Complete the referenced pending step using a flat oneOf body whose type matches it. 200 means successful completion of this step, not necessarily the process; follow authentication.next.options. Invalid proofs return 4xx and leave the step pending unless a limit is reached. Wrong type, unavailable prerequisites, expired/cancelled/completed steps and replay are rejected; retries never issue another grant. A terminal signUp mutation atomically rechecks uniqueness, creates the account and credential, completes the process and issues a one-use session grant. Completing emailVerification for an existing address returns 409 account_exists only after the code was verified, ends signUp without a grant and directs the client to a separate signIn or password reset flow. Never overwrite credentials or bypass existing MFA. A concurrent account creation at finalization follows the same verified-email conflict rule. GET can recover state but never a lost grant.

        ### Request examples

        Each block is a separate request scenario. Supply the headers and path parameters documented for this operation. Token, code and cryptographic values are illustrative; use values issued by your flow.

        #### Password sign-in using email

        Send the Flow-Token for this step. Successful password verification can still require a second factor; inspect authentication.next.options.

        Content-Type: `application/json`

        ```json
        {
          "type": "passwordVerification",
          "login": "alex.smith@example.com",
          "password": "Example-only-Password-42!"
        }
        ```

        #### Password sign-in using username

        Send the Flow-Token for this step. Successful password verification can still require a second factor; inspect authentication.next.options.

        Content-Type: `application/json`

        ```json
        {
          "type": "passwordVerification",
          "login": "alexsmith",
          "password": "Example-only-Password-42!"
        }
        ```

        #### Password reauthentication

        Do not send login: the account comes from the original Bearer session. Send both that Bearer and the Flow-Token.

        Content-Type: `application/json`

        ```json
        {
          "type": "passwordVerification",
          "password": "Example-only-Password-42!"
        }
        ```

        #### Email verification

        Keep the code as a six-character string, including a leading zero. Replace it with the current code issued for this flow/factor.

        Content-Type: `application/json`

        ```json
        {
          "type": "emailVerification",
          "code": "012345"
        }
        ```

        #### TOTP second factor

        Keep the code as a six-character string, including a leading zero. Replace it with the current code issued for this flow/factor.

        Content-Type: `application/json`

        ```json
        {
          "type": "totpVerification",
          "code": "012345"
        }
        ```

        #### Backup code

        Replace with an unused generated backup code. A successful use consumes it.

        Content-Type: `application/json`

        ```json
        {
          "type": "backupCodeVerification",
          "code": "example-unused-backup-code"
        }
        ```

        #### Google ID token

        Replace with the signed token returned by the nonce-bound SDK flow. Do not also send code or state.

        Content-Type: `application/json`

        ```json
        {
          "type": "googleVerification",
          "idToken": "example-provider-signed-id-token"
        }
        ```

        #### Google code and state

        Use the code and state from this step callback. The state binds the callback to the server-held flow; do not generate it on the client.

        Content-Type: `application/json`

        ```json
        {
          "type": "googleVerification",
          "code": "example-provider-code",
          "state": "example-server-issued-state"
        }
        ```

        #### VK code and state

        Use the code and state from this step callback. The state binds the callback to the server-held flow; do not generate it on the client.

        Content-Type: `application/json`

        ```json
        {
          "type": "vkVerification",
          "code": "example-provider-code",
          "state": "example-server-issued-state"
        }
        ```

        #### Discoverable passkey

        Structural example only: send the actual assertion returned by the authenticator. All binary fields use unpadded base64url; the server verifies step, RP ID, origin, user verification and signature.

        Content-Type: `application/json`

        ```json
        {
          "type": "passkeyVerification",
          "credential": {
            "id": "ZXhhbXBsZS1jcmVkZW50aWFsLWlk",
            "rawId": "ZXhhbXBsZS1jcmVkZW50aWFsLWlk",
            "type": "public-key",
            "response": {
              "clientDataJSON": "eyJ0eXBlIjoid2ViYXV0aG4uZ2V0IiwiY2hhbGxlbmdlIjoiZXhhbXBsZS1jaGFsbGVuZ2UiLCJvcmlnaW4iOiJodHRwczovL2FwcC5leGFtcGxlLmNvbSJ9",
